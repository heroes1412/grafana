name: Remote Docker Build & Release

on:
  # Chạy tự động 0h00 ngày 1 hàng tháng (giờ UTC)
  schedule:
    - cron: '0 0 1 * *'
  # Cho phép chạy thủ công bất cứ lúc nào trong tab Actions
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Thêm permissions để GitHub Actions có quyền đọc/ghi Release và Contents
    permissions:
      contents: write

    steps:
      # 1. Lấy version mới nhất trực tiếp từ GitHub API của Grafana và loại bỏ chữ 'v'
      - name: Extract Grafana Version from GitHub API
        id: extract_version
        run: |
          TAG_NAME=$(curl -s https://api.github.com/repos/grafana/grafana/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+')
          
          if [ -z "$TAG_NAME" ]; then
            echo "Lỗi: Không thể lấy version từ GitHub API!"
            exit 1
          fi

          # Xóa bỏ ký tự 'v' đầu tiên (ví dụ: v13.1.1 thành 13.1.1)
          VERSION="${TAG_NAME#v}"

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted Grafana Version: $VERSION"

      # 2. Kiểm tra xem GitHub Release với version này đã tồn tại hay chưa
      - name: Check if Release Exists
        id: check_release
        run: |
          VERSION="${{ steps.extract_version.outputs.VERSION }}"
          # Dùng GitHub CLI (gh) để kiểm tra release, nếu tồn tại trả về 0, ngược lại trả về khác 0
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $VERSION đã tồn tại. Bỏ qua các bước tiếp theo."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release $VERSION chưa tồn tại. Tiếp tục tiến trình..."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Tải file Dockerfile từ máy chủ riêng (chỉ chạy khi chưa có release)
      - name: Download Remote Dockerfile
        if: steps.check_release.outputs.exists == 'false'
        run: |
          curl -fSL "https://web.1921992.xyz/Dockerfile" -o Dockerfile
          echo "Đã tải Dockerfile thành công từ máy chủ riêng!"

      # 4. Đăng nhập vào Docker Hub
      - name: Log in to Docker Hub
        if: steps.check_release.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Cài đặt QEMU hỗ trợ build multi-arch
      - name: Set up QEMU
        if: steps.check_release.outputs.exists == 'false'
        uses: docker/setup-qemu-action@v3

      # 6. Cài đặt Docker Buildx
      - name: Set up Docker Buildx
        if: steps.check_release.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      # 7. Build và Push đa kiến trúc lên Docker Hub với tag là version vừa lấy được
      - name: Build and push Docker image
        if: steps.check_release.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            h2372/grafana-enterprise:${{ steps.extract_version.outputs.VERSION }}
            h2372/grafana-enterprise:latest

      # 8. Tự động tạo Git Tag và GitHub Release tương ứng với version Grafana
      - name: Create GitHub Release and Tag
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.extract_version.outputs.VERSION }}
          name: Grafana ${{ steps.extract_version.outputs.VERSION }}
          body: |
            Job Done:
            - **Grafana Version**: `${{ steps.extract_version.outputs.VERSION }}`
            - **Docker Image**: `h2372/grafana-enterprise:${{ steps.extract_version.outputs.VERSION }}`
            - **Tag Latest**: `h2372/grafana-enterprise:latest`
          draft: false
          prerelease: false
