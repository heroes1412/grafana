name: Remote Docker Build & Release Daily

on:
  # Chạy tự động 0h00 ngày 1 hàng tháng (giờ UTC)
  schedule:
    - cron: '1 5 */2 * *'
  # Cho phép chạy thủ công bất cứ lúc nào trong tab Actions
  workflow_dispatch:

jobs:
  get-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.fetch.outputs.versions }}
      latest_version: ${{ steps.fetch.outputs.latest_version }}
    steps:
      - name: Fetch 3 latest Grafana versions
        id: fetch
        run: |
          RELEASES_JSON=$(curl -s https://api.github.com/repos/grafana/grafana/releases)
          
          # Lấy 3 version mới nhất (loại bỏ chữ 'v' ở đầu)
          VERSIONS=$(echo "$RELEASES_JSON" | jq -c '[ .[] | select(.prerelease == false and .draft == false) | .tag_name | ltrimstr("v") ] | .[:4]')
          LATEST=$(echo "$VERSIONS" | jq -r '.[0]')

          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT
          echo "latest_version=$LATEST" >> $GITHUB_OUTPUT
          echo "Top 3 Grafana Versions: $VERSIONS"
          echo "Latest Grafana Version: $LATEST"

  build-and-push:
    needs: get-versions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ${{ fromJson(needs.get-versions.outputs.versions) }}
      max-parallel: 1
    # Thêm permissions để GitHub Actions có quyền đọc/ghi Release và Contents
    permissions:
      contents: write

    steps:
      # 1. Kiểm tra xem GitHub Release với version này đã tồn tại hay chưa
      - name: Check if Release Exists
        id: check_release
        run: |
          VERSION="${{ matrix.version }}"
          # Dùng GitHub CLI (gh) để kiểm tra release, nếu tồn tại trả về 0, ngược lại trả về khác 0
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $VERSION đã tồn tại. Bỏ qua các bước tiếp theo."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release $VERSION chưa tồn tại. Tiếp tục tiến trình..."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Tải file Dockerfile từ máy chủ riêng và thay thế tag version tương ứng
      - name: Download Remote Dockerfile
        if: steps.check_release.outputs.exists == 'false'
        run: |
          curl -fSL "https://github.com/heroes1412/grafana/releases/download/tool/Dockerfile" -o Dockerfile
          sed -i "s|grafana/grafana-enterprise:latest|grafana/grafana-enterprise:${{ matrix.version }}|g" Dockerfile
          echo "Đã tải và cập nhật Dockerfile cho version ${{ matrix.version }} thành công!"
          head -n 5 Dockerfile

      # 3. Đăng nhập vào Docker Hub
      - name: Log in to Docker Hub
        if: steps.check_release.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Cài đặt QEMU hỗ trợ build multi-arch
      - name: Set up QEMU
        if: steps.check_release.outputs.exists == 'false'
        uses: docker/setup-qemu-action@v3

      # 5. Cài đặt Docker Buildx
      - name: Set up Docker Buildx
        if: steps.check_release.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      # 6. Xác định Docker Tags (gắn tag :latest nếu là version mới nhất)
      - name: Determine Docker Tags
        if: steps.check_release.outputs.exists == 'false'
        id: docker_tags
        run: |
          VERSION="${{ matrix.version }}"
          LATEST="${{ needs.get-versions.outputs.latest_version }}"
          TAGS="h2372/grafana-enterprise:${VERSION}"
          if [ "$VERSION" = "$LATEST" ]; then
            TAGS="${TAGS},h2372/grafana-enterprise:latest"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "Generated Docker Tags: $TAGS"

      # 7. Build và Push đa kiến trúc lên Docker Hub với tag là version tương ứng
      - name: Build and push Docker image
        if: steps.check_release.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker_tags.outputs.tags }}

      # 8. Trích xuất file binary từ Image cho cả 2 kiến trúc (amd64 và arm64)
      - name: Extract binaries from Docker image
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ matrix.version }}"
          IMAGE="h2372/grafana-enterprise:${VERSION}"

          echo "Trích xuất binary cho linux/amd64..."
          docker create --name temp_amd64 --platform linux/amd64 $IMAGE
          docker cp temp_amd64:/usr/share/grafana/bin/grafana ./grafana-amd64
          docker rm temp_amd64

          echo "Trích xuất binary cho linux/arm64..."
          docker create --name temp_arm64 --platform linux/arm64 $IMAGE
          docker cp temp_arm64:/usr/share/grafana/bin/grafana ./grafana-arm64
          docker rm temp_arm64

          ls -lh grafana-amd64 grafana-arm64

      # 9. Tự động tạo Git Tag và GitHub Release tương ứng với version Grafana
      - name: Create GitHub Release and Tag
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.version }}
          name: Grafana ${{ matrix.version }}
          body: |
            Job Done:
            - **Grafana Version**: `${{ matrix.version }}`
            - **Docker Image**: `h2372/grafana-enterprise:${{ matrix.version }}`
            - **Binaries**: `grafana-amd64`, `grafana-arm64`
          files: |
            grafana-amd64
            grafana-arm64
          draft: false
          prerelease: false
