name: Monthly Remote Docker Build & Release

on:
  # Chạy tự động 0h00 ngày 1 hàng tháng (giờ UTC)
  schedule:
    - cron: '0 0 1 * *'
  # Cho phép chạy thủ công bất cứ lúc nào trong tab Actions
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Thêm permissions để GitHub Actions có quyền tự động tạo Release
    permissions:
      contents: write

    steps:
      # 1. Tải file Dockerfile từ máy chủ riêng của bạn về thư mục làm việc
      - name: Download Remote Dockerfile
        run: |
          curl -fSL "https://web.1921992.xyz/Dockerfile" -o Dockerfile
          echo "Đã tải Dockerfile thành công từ máy chủ riêng!"

      # 2. Lấy version Grafana trực tiếp từ metadata image gốc trên Docker Hub (siêu nhanh, không cần pull/run)
      - name: Extract Grafana Version from Image Metadata
        id: extract_version
        run: |
          # Sử dụng buildx imagetools để lấy thông tin nhãn (labels) hoặc config của image gốc
          # Grafana thường đính kèm version trực tiếp vào org.opencontainers.image.version hoặc tương tự
          RAW_INFO=$(docker buildx imagetools inspect grafana/grafana-enterprise:latest --format '{{json .}}')
          
          # Hoặc cách đơn giản và chắc chắn nhất là trích xuất version thông qua biến môi trường/label, 
          # nếu không lấy được qua OCI label, ta có thể dùng lệnh ép lấy version qua manifest/config.
          # Ở đây ta dùng cách gọi nhanh:
          FULL_VERSION=$(echo "$RAW_INFO" | grep -oE '"version":"[0-9]+\.[0-9]+\.[0-9]+"' | head -n 1 | cut -d'"' -f4)
          
          # Fallback an toàn: Nếu không bắt được qua json label, quét trực tiếp chuỗi định danh
          if [ -z "$FULL_VERSION" ]; then
            FULL_VERSION=$(docker manifest inspect grafana/grafana-enterprise:latest | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 | tr -d 'v')
          fi

          if [ -z "$FULL_VERSION" ]; then
            echo "Lỗi: Không thể trích xuất version từ image gốc!"
            exit 1
          fi

          echo "VERSION=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "Extracted Grafana Version: $FULL_VERSION"

      # 3. Đăng nhập vào Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Cài đặt QEMU hỗ trợ build multi-arch
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 5. Cài đặt Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Build và Push đa kiến trúc lên Docker Hub với tag là version vừa lấy được
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            h2372/grafana-enterprise:${{ steps.extract_version.outputs.VERSION }}
            h2372/grafana-enterprise:latest

      # 7. Tự động tạo Git Tag và GitHub Release tương ứng với version Grafana
      - name: Create GitHub Release and Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.extract_version.outputs.VERSION }}
          name: Grafana ${{ steps.extract_version.outputs.VERSION }}
          body: |
            Tự động build và push image thành công lên Docker Hub.
            - **Grafana Version**: `${{ steps.extract_version.outputs.VERSION }}`
            - **Docker Image**: `h2372/grafana-enterprise:${{ steps.extract_version.outputs.VERSION }}`
            - **Tag Latest**: `h2372/grafana-enterprise:latest`
          draft: false
          prerelease: false
