name: Monthly Remote Docker Build & Release

on:
  # Chạy tự động 0h00 ngày 1 hàng tháng (giờ UTC)
  schedule:
    - cron: '0 0 1 * *'
  # Cho phép chạy thủ công bất cứ lúc nào trong tab Actions
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Thêm permissions để GitHub Actions có quyền tự động tạo Release
    permissions:
      contents: write

    steps:
      # 1. Lấy ngày hiện tại theo định dạng DDMMYYYY (Ví dụ: 01072026)
      - name: Generate Date Tag
        id: date_tag
        run: |
          CURRENT_DATE=$(TZ="Asia/Ho_Chi_Minh" date +'%d%m%Y')
          echo "TAG=$CURRENT_DATE" >> $GITHUB_OUTPUT
          echo "Generated tag: $CURRENT_DATE"

      # 2. Tải file Dockerfile từ máy chủ riêng của bạn về thư mục làm việc
      - name: Download Remote Dockerfile
        run: |
          curl -fSL "https://web.1921992.xyz/Dockerfile" -o Dockerfile
          echo "Đã tải Dockerfile thành công từ máy chủ riêng!"

      # 3. Đăng nhập vào Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Cài đặt QEMU hỗ trợ build multi-arch
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 5. Cài đặt Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Build và Push đa kiến trúc lên Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            h2372/grafana-enterprise:${{ steps.date_tag.outputs.TAG }}
            h2372/grafana-enterprise:latest

      # 7. Tự động tạo Git Tag và GitHub Release tương ứng với ngày build
      - name: Create GitHub Release and Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date_tag.outputs.TAG }}
          name: "Grafana Enterprise Release ${{ steps.date_tag.outputs.TAG }}"
          body: |
            Tự động build và push image thành công lên Docker Hub.
            - **Docker Image**: `h2372/grafana-enterprise:${{ steps.date_tag.outputs.TAG }}`
            - **Tag Latest**: `h2372/grafana-enterprise:latest`
          draft: false
          prerelease: false
